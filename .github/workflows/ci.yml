name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies only: devDependencies are never shipped.
      - name: Audit production dependencies
        run: npm audit --omit=dev

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier
        run: npm run format:check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20, 22, 24 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v5
        with:
          # Explicit token — tokenless OIDC is flaky on GitHub Actions.
          # Was silently failing before, producing the 0% coverage you
          # saw on the Codecov dashboard.
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hmake98/nestjs-temporal-core
          files: ./coverage/lcov.info
          # Fail the job if upload fails so silent failures don't
          # masquerade as green CI (the root cause of the 0% bug).
          fail_ci_if_error: true
          verbose: true

      # Upload JUnit results to Codecov Test Analytics so flaky-test
      # detection and per-test timing data show up on the dashboard and
      # in PR comments. `!cancelled()` ensures we still upload when a
      # test has failed — failed test data is the whole point of this.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node-version == 20 }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hmake98/nestjs-temporal-core
          files: ./junit.xml
          fail_ci_if_error: true
          verbose: true

  integration:
    name: Integration (real Temporal dev server)
    runs-on: ubuntu-latest
    env:
      TEMPORAL_DEV_SERVER_DIR: ${{ github.workspace }}/.temporal-dev-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The dev server binary is downloaded on first use; cache it, keyed on the lockfile (the SDK version moves with it).
      - name: Cache Temporal dev server
        uses: actions/cache@v4
        with:
          path: .temporal-dev-server
          key: temporal-dev-server-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            temporal-dev-server-${{ runner.os }}-

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
